name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-static-site:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-static-site:${{ github.sha }}


  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Validate SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/ec2-key.pem

          echo "Key file created"
          wc -c /tmp/ec2-key.pem

          echo "Key header:"
          head -n 1 /tmp/ec2-key.pem

          echo "Key footer:"
          tail -n 1 /tmp/ec2-key.pem

          echo "Testing PEM..."
          ssh-keygen -y -f /tmp/ec2-key.pem > /tmp/public-key.pub

          echo "SSH key is VALID"

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker stop my-app || true
            docker rm my-app || true

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-static-site:latest

            docker run -d \
              -p 80:80 \
              --name my-app \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-static-site:latest
